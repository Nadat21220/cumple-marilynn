<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Cumpleaños Marilynn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --s:3; --blood:#c8102e; --gold:#ffd86b; --bg:#07040c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; font-family:'Press Start 2P', monospace; color:#f4f1ec; }
  body{ display:flex; align-items:center; justify-content:center; }
  #wrap{ position:relative; width:calc(320px * var(--s)); height:calc(180px * var(--s)); image-rendering:pixelated; }
  canvas{ display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; cursor:crosshair; }
  canvas.hot{ cursor:pointer; }
  /* CRT scanlines + vignette */
  #crt{ pointer-events:none; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 1px, transparent 1px, transparent 3px);
    box-shadow: inset 0 0 calc(40px * var(--s)) rgba(0,0,0,.75); }
  #ui{ pointer-events:none; position:absolute; inset:0; }
  .px{ font-size:calc(4px * var(--s)); line-height:1.6; text-shadow: calc(1px*var(--s)) calc(1px*var(--s)) 0 #000; }
  #room{ position:absolute; left:calc(4px*var(--s)); top:calc(4px*var(--s)); color:var(--gold); }
  #hint{ position:absolute; left:0; right:0; bottom:calc(4px*var(--s)); text-align:center; color:#e8dcd0; }
  #tip{ position:absolute; color:#fff; background:rgba(10,4,14,.9); border:calc(1px*var(--s)) solid var(--blood); padding:calc(2px*var(--s)) calc(3px*var(--s)); white-space:nowrap; display:none; }
  #bar{ position:absolute; left:50%; top:calc(14px*var(--s)); transform:translateX(-50%); width:calc(120px*var(--s)); height:calc(10px*var(--s)); border:calc(1px*var(--s)) solid #fff; background:#1a0a10; display:none; padding:calc(1px*var(--s)); }
  #barfill{ height:100%; width:0%; background:linear-gradient(90deg,#7a0012,var(--blood),#ff5e78); }
  #barlbl{ position:absolute; left:50%; top:calc(26px*var(--s)); transform:translateX(-50%); color:#ff5e78; display:none; }
  #banner{ position:absolute; left:0; right:0; top:calc(10px*var(--s)); text-align:center; font-size:calc(6px*var(--s)); color:var(--gold); display:none; animation:blink 1s steps(2) infinite; text-shadow: calc(1px*var(--s)) calc(1px*var(--s)) 0 var(--blood), calc(2px*var(--s)) calc(2px*var(--s)) 0 #000; }
  @keyframes blink{ 50%{ color:#fff; } }
  #start{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(8px*var(--s)); background:rgba(7,4,12,.92); pointer-events:auto; cursor:pointer; text-align:center; }
  #start h1{ font-size:calc(7px*var(--s)); color:var(--blood); text-shadow: calc(1px*var(--s)) calc(1px*var(--s)) 0 #000, 0 0 calc(6px*var(--s)) var(--blood); line-height:1.6; }
  #start p{ font-size:calc(4px*var(--s)); color:#e8dcd0; animation:blink .9s steps(2) infinite; }
  #start small{ font-size:calc(3px*var(--s)); color:#8a7a86; line-height:1.8; }
  /* Carta */
  #letter{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.75); pointer-events:auto; }
  #paper{ width:calc(240px*var(--s)); max-height:calc(168px*var(--s)); overflow-y:auto; scrollbar-width:thin; background:#f6ecd8; color:#2b1a22; border:calc(2px*var(--s)) solid #2b1a22; box-shadow: calc(4px*var(--s)) calc(4px*var(--s)) 0 var(--blood); padding:calc(10px*var(--s)); font-size:calc(4px*var(--s)); line-height:2; position:relative; }
  #paper h2{ font-size:calc(5px*var(--s)); color:var(--blood); margin-bottom:calc(6px*var(--s)); }
  #paper p{ margin-bottom:calc(5px*var(--s)); white-space:pre-wrap; }
  #close{ position:absolute; right:calc(4px*var(--s)); top:calc(4px*var(--s)); background:var(--blood); color:#fff; border:calc(1px*var(--s)) solid #2b1a22; padding:calc(2px*var(--s)) calc(3px*var(--s)); cursor:pointer; font-family:inherit; font-size:calc(4px*var(--s)); }
  #paper::after{ content:""; position:absolute; left:calc(14px*var(--s)); bottom:calc(-1px*var(--s)); width:calc(6px*var(--s)); height:calc(6px*var(--s)); background:var(--blood); border-radius:50% 50% 50% 0; opacity:.9; }
  /* Cinemática secreta antes de la carta */
  #meme{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.92); pointer-events:auto; flex-direction:column; gap:calc(6px*var(--s)); cursor:pointer; }
  #memebox{ width:calc(220px*var(--s)); background:#000; border:calc(2px*var(--s)) solid var(--blood); box-shadow:0 0 calc(10px*var(--s)) rgba(200,16,46,.6); }
  #memeframe{ position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  #memeframe iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  #memelbl{ color:#e8dcd0; font-size:calc(4px*var(--s)); text-align:center; animation:blink .9s steps(2) infinite; }
  #memeskip{ background:var(--blood); color:#fff; border:calc(1px*var(--s)) solid #2b1a22; padding:calc(2px*var(--s)) calc(4px*var(--s)); cursor:pointer; font-family:inherit; font-size:calc(4px*var(--s)); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="g" width="320" height="180"></canvas>
  <div id="crt"></div>
  <div id="ui">
    <div id="room" class="px"></div>
    <div id="hint" class="px"></div>
    <div id="tip" class="px"></div>
    <div id="bar"><div id="barfill"></div></div>
    <div id="barlbl" class="px">¡CLICK CLICK CLICK!</div>
    <div id="banner">FELIZ CUMPLEAÑOS<br>MARILYNN</div>
    <div id="start">
      <h1>LA CASA DEL<br>CONEJO VAMPIRO</h1>
      <p>&gt; PULSA PARA ENTRAR &lt;</p>
      <small>una aventura pixel para Marilynn<br>(activa el sonido)</small>
    </div>
    <div id="letter">
      <div id="paper">
        <button id="close">X</button>
        <h2>Para Marilynn</h2>
        <div id="lettertext"></div>
      </div>
    </div>
    <div id="meme">
      <div id="memebox">
        <div id="memeframe"><iframe id="memeiframe" src="" title="sorpresa" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
      </div>
      <div id="memelbl">&gt; toca para saltar &lt;</div>
      <button id="memeskip">SALTAR ▶</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
// Texto de la carta.
const CARTA = [
  "Hello, mi querida Marilynn:",
  "Espero que te guste la decoración, creo que se me pasó la mano con lo <em>darketo</em>. ¿Ya encontraste al gato de la sala? Sé que es un poco cursi, pero es la mejor manera original que se me ocurrió para festejar tu cumple. Sé que no es un regalo como tal, simplemente es un medio para desearte un feliz cumpleaños, ya que sé que a lo mejor puede ser un día difícil, en especial por la madriza que te pusieron en judo (aunque tengo fe en que ganaste).",
  "Quiero darte las gracias por siempre estar a mi lado cuando estoy depre o simplemente ando medio estúpido. Este semestre tú me enseñaste un tipo de amistad que no conocía y me demostraste que, para poder querer a una persona, no es necesario verse físicamente. Sobre todo, gracias por aguantarme y aconsejarme cuando lo he ocupado, porque de verdad tú me ayudaste en algunos de mis días más difíciles y sin ti no creo que estuviera aquí, así que gracias. Te deseo que estés con las personas que amas y quiero que sepas que siempre tendrás un lugar en mi patata.",
  "¡FELIZ CUMPLEAÑOS, MI QUERIDA AMIGA!",
  "Con mucha estima, tu amigo y fiel némesis,\nMota."
];

const W = 320, H = 180;
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const wrap = $('wrap');

function fit(){
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit); fit();

/* =========================================================
   AUDIO (chiptune mínimo con WebAudio)
   ========================================================= */
let AC = null;
function audio(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, dur=0.08, type='square', vol=0.08, when=0, slide=0){
  try{
    const ac = audio(); const o = ac.createOscillator(); const g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime+when);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide), ac.currentTime+when+dur);
    g.gain.setValueAtTime(vol, ac.currentTime+when); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+when+dur);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime+when); o.stop(ac.currentTime+when+dur+0.02);
  }catch(e){}
}
function noise(dur=0.15, vol=0.05, when=0){
  try{
    const ac = audio(); const b = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate); const d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    const s = ac.createBufferSource(); s.buffer=b; const g = ac.createGain(); g.gain.value=vol;
    const f = ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=1500;
    s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime+when);
  }catch(e){}
}
const SFX = {
  hover(){ tone(880,0.03,'square',0.02); },
  click(){ tone(440,0.05,'square',0.05); tone(660,0.05,'square',0.05,0.05); },
  door(){ tone(110,0.4,'sawtooth',0.06,0,-60); noise(0.3,0.03,0.1); },
  bats(){ for(let i=0;i<6;i++){ tone(1800+Math.random()*800,0.05,'square',0.03,i*0.07,-900); } },
  cat(){ tone(600,0.18,'triangle',0.08,0,300); tone(900,0.25,'triangle',0.08,0.18,-400); },
  thunder(){ noise(0.9,0.12); tone(50,0.8,'sawtooth',0.08,0,-20); },
  tap(){ tone(300+Math.random()*200,0.04,'square',0.05); },
  tick(){ tone(1200,0.03,'square',0.03); },
  ghost(){ tone(300,0.5,'sine',0.06,0,200); tone(250,0.5,'sine',0.05,0.3,-120); },
  fanfare(){
    const seq=[523,659,784,1047,784,1047,1319,1568];
    seq.forEach((f,i)=>tone(f,0.14,'square',0.07,i*0.11));
    [262,330,392,523].forEach((f,i)=>tone(f,0.5,'triangle',0.05,0.9+i*0.02));
  },
  paper(){ noise(0.12,0.04); tone(1500,0.06,'triangle',0.03,0.05); }
};

/* =========================================================
   HELPERS DE DIBUJO
   ========================================================= */
const R = (x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
const P = (x,y,c)=>R(x,y,1,1,c);
function spr(rows, pal, x, y, sc=1, flip=false){
  const w = rows[0].length;
  for(let j=0;j<rows.length;j++){
    const row = rows[j];
    for(let i=0;i<w;i++){
      const ch = row[i]; if(ch==='.'||ch===' ') continue;
      const c = pal[ch]; if(!c) continue;
      const xi = flip ? (w-1-i) : i;
      R(x+xi*sc, y+j*sc, sc, sc, c);
    }
  }
}
function txt(s, x, y, c='#fff', size=8, align='left'){
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.textAlign = align; ctx.textBaseline='top'; ctx.fillStyle=c; ctx.fillText(s, Math.round(x), Math.round(y));
}
function dither(x,y,w,h,c,step=2){ ctx.fillStyle=c; for(let j=0;j<h;j++) for(let i=(j%2?1:0);i<w;i+=step) ctx.fillRect(x+i,y+j,1,1); }
function glowRect(x,y,w,h,t,col='#ffd86b'){
  const a = 0.55 + 0.45*Math.sin(t*8);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.strokeRect(x-1.5,y-1.5,w+3,h+3);
  ctx.globalAlpha = a*0.25; ctx.fillStyle = col; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.restore();
}

/* =========================================================
   SPRITES
   ========================================================= */
const BUNNY = [
"..........KKKKKKKK..........",
".......KKKWWWWWWWWKKK.......",
"......KWWWWWWWWWWWWWWK......",
".....KWWWWWWWWWWWWWWWWK.....",
"....KWWWWWWWWWWWWWWWWWWK....",
"..KKKWWWWWWWWWWWWWWWWWWKKK..",
".KWWKWWWWWWWWWWWWWWWWWWKWWK.",
".KWIKWWWEEWWWWWWWWEEWWWKIWK.",
".KWIKWWWEHWWWWWWWWEHWWWKIWK.",
".KWIKWWWEEWWWWWWWWEEWWWKIWK.",
".KWIKWWWWWWWWWWWWWWWWWWKIWK.",
".KWIKWWWWWWWPPWWWWWWWWWKIWK.",
".KWIKWWWWWWWSSWWWWWWWWWKIWK.",
".KWIKWWWWWWSWWSWWWWWWWWKIWK.",
".KWIKSWWWWWWWWWWWWWWWWSKIWK.",
".KWIK.KWWWWWWWWWWWWWWK.KIWK.",
".KWWK..KKWWWWWWWWWWKK..KWWK.",

".....KWWWWWWWWWWWWWWWWK.....",
"....KWWWWWWWWWWWWWWWWWWK....",
"...KWWWWWWWWWWWWWWWWWWWWK...",
"...KWWWWWWWWWWWWWWWWWWWWK...",
"..KWWWWWWWWWWWWWWWWWWWWWWK..",
"..KWWWWWWWWWWWWWWWWWWWWWWK..",
"..KWWWWWWWWWWWWWWWWWWWWWWK..",
"..KWSWWWWWWWWWWWWWWWWWWSWK..",
"..KSSSWWWWWWWWWWWWWWWWSSSK..",
".KWWWWKWWWWWWWWWWWWWWKWWWWK.",
".KWSWSKWWWWWWWWWWWWWWKWSWSK.",
"..KKKK.KKKKKKKKKKKKKK.KKKK..",
];
const BUNNY_PAL = { W:'#fbf7f0', S:'#ddd3c6', K:'#2b2228', E:'#14101a', H:'#ffffff', P:'#f2a3b6', I:'#f0c3cc' };

const BAT = [[
"K.........K",
"KK.......KK",
"KKK..K..KKK",
".KKKKKKKKK.",
"...KKRKK...",
"....K.K....",
],[
"...........",
"....KKK....",
".KKKKRKKKK.",
"KK..KKK..KK",
"K....K....K",
"...........",
]];
const BAT_PAL = { K:'#17101c', R:'#ff2d4a' };

const CAT = [
".....KK.....KK",
".....KKKKKKKKK",
".....KKYKKYKKK",
".....KKKKKKKKK",
"K....KKKKKKKK.",
"KK..KKKKKKKK..",
".KKKKKKKKKKK..",
"..KKKKKKKKKK..",
"....KK...KK...",
"....KK...KK...",
];
const CAT_PAL = { K:'#0d0a12', Y:'#ffe14a' };

const GHOST_BUNNY = [ // carita de conejo vampiro (ventana / buzón)
"..KK......KK..",
".KWWK....KWWK.",
".KWWK....KWWK.",
".KWWKKKKKKWWK.",
".KWWWWWWWWWWK.",
"KWWWRWWWWRWWWK",
"KWWWWWWWWWWWWK",
"KWWWWWPPWWWWWK",
"KWWWWFWWFWWWWK",
".KWWWWWWWWWWK.",
"..KKKKKKKKKK..",
];
const GHOST_PAL = { K:'#2b2228', W:'#e9e2f0', R:'#ff2d4a', P:'#f2a3b6', F:'#ffffff' };

const CROW = [
"....K.",
"...KKK",
"K.KKKK",
"KKKKK.",
".KKK..",
"..K.K.",
];

/* =========================================================
   ESTADO
   ========================================================= */
let t = 0, last = performance.now();
let scene = 'exterior';
let mouse = { x:-1, y:-1, down:false };
let hover = null, lastHover = null;
let fade = { a:1, dir:-1, cb:null };  // empieza en negro y aclara
let fx = [];
const S = {
  started:false,
  lightning:0, nextLightning: 3,
  catOut:false, catCooldown:0,
  foyerT:0, catLying:false, catSfx:false, catZ:-1,   // recibidor: tiempo en la sala y gato del sillón
  batsCooldown:0,
  mailOpen:0,
  portraitLook:0,
  candleOn:true,
  fridgeOpen:false,
  stairsBlock:0,
  gift:{ progress:0, shake:0, opened:false, revealT:0, pops:0 },
  letterUnlocked:false,
  visited:{}
};

function goto(name){
  SFX.door();
  fade.dir = 1; fade.cb = ()=>{ scene = name; hover=null; fx=[]; onEnter(name); };
}
function onEnter(name){
  S.visited[name]=true;
  if(name==='foyer'){ S.foyerT=0; S.catLying=false; S.catSfx=false; S.catZ=-1; }
  const names = { exterior:'EXTERIOR', foyer:'RECIBIDOR', hall:'PASILLO', dining:'COCINA / COMEDOR' };
  $('room').textContent = names[name];
  const hints = {
    exterior:'explora la casa... pulsa la puerta para entrar',
    foyer:'la casa parece... ¿habitada?',
    hall:'las escaleras no parecen seguras',
    dining:'hay algo sobre la mesa'
  };
  $('hint').textContent = hints[name];
  $('banner').style.display = (name==='dining' && S.gift.opened) ? 'block' : 'none';
}

/* =========================================================
   EFECTOS
   ========================================================= */
function spawnBats(x,y,n=7){
  SFX.bats();
  for(let i=0;i<n;i++){
    fx.push({ kind:'bat', x:x+(Math.random()*8-4), y:y, vx:(Math.random()-0.5)*40, vy:-(30+Math.random()*40), ph:Math.random()*6, life:0, max:3.5+Math.random()*2,
      update(dt){ this.life+=dt; this.x+=this.vx*dt + Math.sin(this.life*6+this.ph)*0.7; this.y+=this.vy*dt; this.vx+= (Math.random()-0.5)*20*dt; if(this.y<-10||this.life>this.max) this.dead=true; },
      draw(){ spr(BAT[Math.floor((this.life*12+this.ph)%2)], BAT_PAL, this.x, this.y); } });
  }
}
function spawnCat(x,y){
  SFX.cat();
  fx.push({ kind:'cat', x, y, vx:70, vy:-95, g:260, life:0,
    update(dt){ this.life+=dt; this.vy+=this.g*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; if(this.y>y) { this.y=y; this.vy=-40; } if(this.x>W+20) this.dead=true; },
    draw(){ spr(CAT, CAT_PAL, this.x, this.y - 10); } });
  // tapa del bote volando
  fx.push({ x:x+2, y:y-14, vx:-30, vy:-120, r:0, life:0,
    update(dt){ this.life+=dt; this.vy+=300*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.r+=dt*10; if(this.y>H+10) this.dead=true; },
    draw(){ ctx.save(); ctx.translate(this.x+6,this.y+1); ctx.rotate(this.r); R(-6,-1,12,2,'#7d8591'); R(-5,-2,10,1,'#aab2bd'); ctx.restore(); } });
}
function spawnParticles(x,y,n,colors,spd=90,grav=120,life=1.6){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = spd*(0.3+Math.random());
    fx.push({ x,y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - spd*0.6, c:colors[i%colors.length], life:0, max:life*(0.6+Math.random()*0.6), sz:1+Math.floor(Math.random()*2),
      update(dt){ this.life+=dt; this.vy+=grav*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; if(this.life>this.max) this.dead=true; },
      draw(){ if(Math.floor(this.life*20)%4===0 && this.life>this.max*0.7) return; R(this.x,this.y,this.sz,this.sz,this.c); } });
  }
}
function spawnText(x,y,s,c='#ffd86b'){
  fx.push({ x,y,s,c,life:0, update(dt){ this.life+=dt; this.y-=18*dt; if(this.life>0.8) this.dead=true; }, draw(){ txt(this.s,this.x,this.y,this.c,6,'center'); } });
}
function spawnGhost(x,y){
  SFX.ghost();
  fx.push({ x,y,life:0, update(dt){ this.life+=dt; this.y-=6*dt; if(this.life>2.2) this.dead=true; },
    draw(){ ctx.save(); ctx.globalAlpha = Math.min(1,this.life*2) * Math.max(0,1-(this.life-1.2)); spr(GHOST_BUNNY, GHOST_PAL, this.x, this.y + Math.sin(this.life*5)*1.5); ctx.restore(); } });
}
// gotas de sangre persistentes (deslizan y reaparecen)
const drips = [];
function initDrips(list){ drips.length=0; list.forEach(d=>drips.push({...d, p:Math.random()})); }
function drawDrips(dt, col='#9c0a24'){
  for(const d of drips){
    d.p += dt*d.spd; if(d.p>1){ d.p=0; }
    const y = d.y + d.p*d.len;
    R(d.x, d.y, 1, y-d.y, col); R(d.x, y, 1, 2, '#e0203c'); if(d.p>0.1) R(d.x, y-1, 1, 1, '#c8102e');
  }
}

/* =========================================================
   ESCENAS
   ========================================================= */
const stars = Array.from({length:70},()=>({x:Math.random()*W, y:Math.random()*110, ph:Math.random()*6, b:Math.random()}));
const fog = Array.from({length:10},(_,i)=>({x:i*40-20, y:148+Math.random()*20, w:50+Math.random()*40, spd:4+Math.random()*6, a:0.08+Math.random()*0.1}));

/* ---------- EXTERIOR ---------- */
function drawExterior(dt){
  // cielo
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b0518'); g.addColorStop(0.6,'#1d0b2e'); g.addColorStop(1,'#3a0f2a');

const fireFlick = ()=> 0.82 + 0.10*Math.sin(t*9) + 0.06*Math.sin(t*23+1) + 0.04*Math.sin(t*41);

// sprites precalculados en un canvas aparte, para poder dibujarlos "chuecos" (inclinados) sin perder el look de pixeles
const _pre = {};
function pre(key,w,h,fn){ if(!_pre[key]){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d')); _pre[key]=c; } return _pre[key]; }
function sprTo(c,rows,pal,x,y){ for(let j=0;j<rows.length;j++) for(let i=0;i<rows[j].length;i++){ const col=pal[rows[j][i]]; if(col){ c.fillStyle=col; c.fillRect(x+i,y+j,1,1); } } }
// dibuja el sprite girado (ángulo = atan(skew)) alrededor de su centro; (x,y) = esquina sup. izq. del sprite sin girar
function drawTilted(img,x,y,skew){ ctx.save(); ctx.imageSmoothingEnabled=false; ctx.translate(Math.round(x+img.width/2),Math.round(y+img.height/2)); ctx.rotate(Math.atan(skew)); ctx.drawImage(img,Math.round(-img.width/2),Math.round(-img.height/2)); ctx.restore(); }
function scaleRows(rows,f){   // agranda un sprite por vecino más cercano (para el árbol)
  const w=Math.round(rows[0].length*f), h=Math.round(rows.length*f), out=[];
  for(let j=0;j<h;j++){ let r=''; for(let i=0;i<w;i++) r+=rows[Math.min(rows.length-1,Math.floor(j/f))][Math.min(rows[0].length-1,Math.floor(i/f))]; out.push(r); }
  return out;
}
// sofá visto de frente; `skew` lo gira (negativo: sube hacia la derecha, positivo: baja hacia la derecha)
function sofa(x,y,w,h,pal,skew){
  const img = pre('sofa'+w+'x'+h, w, h+6, c=>{
    const [d,m,l,k] = pal, r=(a,b,cw,ch,col)=>{ c.fillStyle=col; c.fillRect(a,b,cw,ch); }, clr=(a,b)=>c.clearRect(a,b,1,1);
    const bh = Math.round(h*0.52), seatY = bh-2, seatH = Math.round(h*0.26), legY = seatY+seatH;
    const armY = Math.round(h*0.3), armH = legY-armY+1, aw = Math.max(5,Math.round(w*0.17));
    r(aw-1,0,w-2*aw+2,bh,m); r(aw-1,0,w-2*aw+2,1,l);                       // respaldo alto
    const mid = Math.round(w/2); r(mid,2,1,bh-3,d);                          // separa los 2 cojines del respaldo
    r(aw+2,bh-5,1,1,l); r(w-aw-3,bh-5,1,1,l); r(mid-1,bh-5,1,1,l);          // botones capitoné
    r(0,armY,aw,armH,m); r(0,armY,aw,2,l); clr(0,armY); r(0,armY+armH-1,aw,1,d);     // brazo izq. enrollado
    r(w-aw,armY,aw,armH,m); r(w-aw,armY,aw,2,l); clr(w-1,armY); r(w-aw,armY+armH-1,aw,1,d); // brazo der.
    r(aw,seatY,w-2*aw,seatH,m); r(aw,seatY,w-2*aw,1,l); r(aw,seatY+seatH-1,w-2*aw,1,d); r(mid,seatY+1,1,seatH-2,d); // asiento con 2 cojines
    r(2,legY,w-4,2,d); r(3,legY+2,2,3,k); r(w-5,legY+2,2,3,k);              // base y patas
    r(aw+1,seatY-3,5,4,'#5a1428'); r(aw+1,seatY-3,5,1,'#8a2040');            // cojín decorativo granate
  });
  drawTilted(img,x,y,skew);
}
// sombra proyectada hacia arriba por la luz de la chimenea (que está abajo a la derecha)
function castShadow(x0,x1,yb,len,widen=1.1,al=0.34){
  const f = fireFlick(), L = len*f, cx = (x0+x1)/2, sway = (cx-250)*0.4*f;
  ctx.fillStyle = '#05000c';
  for(let j=0;j<L;j++){
    const p = j/L, hw = (x1-x0)/2*(1+(widen-1)*p), c = cx+sway*p;
    ctx.globalAlpha = al*(1-p*0.55);
    ctx.fillRect(Math.round(c-hw), Math.round(yb-j), Math.round(hw*2), 1);
  }
  ctx.globalAlpha = 1;

function toLogical(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
cv.addEventListener('mousemove', e=>{ const p=toLogical(e); mouse.x=p.x; mouse.y=p.y; });
cv.addEventListener('mouseleave', ()=>{ mouse.x=-1; mouse.y=-1; });
cv.addEventListener('mousedown', e=>{ const p=toLogical(e); mouse.x=p.x; mouse.y=p.y; pressAt(); });
cv.addEventListener('touchstart', e=>{ e.preventDefault(); const p=toLogical(e.touches[0]); mouse.x=p.x; mouse.y=p.y; pressAt(); }, {passive:false});
function pressAt(){
  if(!S.started) return;
  audio();
  if(fade.dir===1) return;
  const h = hitTest(); if(h){ SFX.click(); h.click && h.click(); }
}
function hitTest(){
  const list = activeHotspots();
  for(let i=list.length-1;i>=0;i--){ const h=list[i]; if(mouse.x>=h.x&&mouse.x<h.x+h.w&&mouse.y>=h.y&&mouse.y<h.y+h.h) return h; }
  return null;
}

});

const dripsByScene = {
  exterior:[{x:150,y:106,len:30,spd:0.15},{x:168,y:108,len:24,spd:0.11},{x:112,y:104,len:18,spd:0.13},{x:212,y:104,len:20,spd:0.09}],

  dining:[{x:124,y:60,len:20,spd:0.1},{x:168,y:36,len:30,spd:0.12}],
};
let lastScene = null;
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  if(scene!==lastScene){ initDrips(dripsByScene[scene]||[]); lastScene=scene; }
  // update estado
  S.batsCooldown-=dt; S.catCooldown-=dt; if(S.mailOpen>0){ S.mailOpen+=dt; if(S.mailOpen>2.5) S.mailOpen=0; }
  const g=S.gift; if(!g.opened){ g.progress=Math.max(0,g.progress-dt*14); g.shake=Math.max(0,g.shake-dt*6); $('barfill').style.width=g.progress+'%'; if(g.progress<=0 && $('bar').style.display==='block'){ $('bar').style.display='none'; $('barlbl').style.display='none'; } } else { g.revealT+=dt; }
  // draw escena
  ({exterior:drawExterior, foyer:drawFoyer, hall:drawHall, dining:drawDining})[scene](dt);
  // fx
  for(const f of fx){ f.update(dt); } fx = fx.filter(f=>!f.dead); for(const f of fx) f.draw();
  // hover
  hover = S.started && fade.dir!==1 ? hitTest() : null;
  cv.classList.toggle('hot', !!hover);
  if(hover){
    glowRect(hover.x,hover.y,hover.w,hover.h,t,hover.col||'#ffd86b');
    if(hover!==lastHover){ SFX.hover(); hover.hover && hover.hover(); }
    const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'));
    const tip=$('tip'); tip.style.display='block'; tip.textContent=hover.label; tip.style.left=Math.min(W-60,mouse.x+6)*s+'px'; tip.style.top=Math.max(2,mouse.y-12)*s+'px';
  } else { $('tip').style.display='none'; }
  lastHover=hover;
  // fade
  if(fade.dir!==0){
    fade.a += fade.dir*dt*2.2;
    if(fade.dir===1 && fade.a>=1){ fade.a=1; fade.dir=-1; fade.cb && fade.cb(); fade.cb=null; }
    if(fade.dir===-1 && fade.a<=0){ fade.a=0; fade.dir=0; }
  }
  if(fade.a>0){ ctx.fillStyle=`rgba(3,1,6,${fade.a})`; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(frame);
}
document.fonts && document.fonts.load('8px "Press Start 2P"').finally(()=>requestAnimationFrame(frame)) || requestAnimationFrame(frame);
